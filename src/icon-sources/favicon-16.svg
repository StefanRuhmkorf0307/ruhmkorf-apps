<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoughCalculator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Vereinfachte Fassung fuer die 16px-Ebene von favicon.ico.

       Warum ueberhaupt eine eigene: Das volle Motiv (assets/favicon.svg)
       zerfaellt bei echten 16 Pixeln - das Prozentzeichen wird zu einem
       Grauwertraster ueber dem Laib. Bei 32px (Retina-Tableiste) und
       darueber traegt es dagegen einwandfrei, dort steckt es unveraendert
       in der ICO-Datei.

       Warum das Prozentzeichen und nicht der Laib: Der Laib ist das
       gemeinsame Element des Zeichenpaars, das Prozentzeichen das
       unterscheidende. Wenn auf dieser Groesse nur eines uebrig bleiben
       kann, dann das, was den Rechner von DoughPilot trennt.

       Feste Farben statt Variablen: Eine ICO-Datei kann nicht auf
       prefers-color-scheme reagieren. Die dunkle Kachel mit hellem Zeichen
       traegt auf hellen wie dunklen Tableisten - dieselbe Entscheidung wie
       beim Apple-Touch-Icon.

       Diese Datei wird nicht mitausgeliefert (der Build kopiert nur
       src/assets/). Sie liegt hier, damit die ICO-Datei reproduzierbar
       bleibt - siehe README, Abschnitt "Icons". -->
  <rect width="64" height="64" rx="14" fill="#2d4635"/>
  <g transform="translate(32 32) scale(1.55) translate(-32 -17.5)">
    <circle cx="23" cy="12" r="4.8" fill="none" stroke="#f4eddc" stroke-width="4.2"/>
    <circle cx="41" cy="23" r="4.8" fill="none" stroke="#f4eddc" stroke-width="4.2"/>
    <line x1="43" y1="8" x2="21" y2="27" stroke="#f4eddc" stroke-width="4.4" stroke-linecap="round"/>
  </g>
</svg>
