<h1>Das Zeichenpaar</h1>
<p>Beide teilen denselben Laib mit aufgestelltem Ohr. Der Rechner trägt die S-Kurve als Einschnitt, die App stattdessen den Kompassbogen — gleiche Formsprache, klar unterscheidbar.</p>
