name: Deploy to IONOS (SFTP)

# Deployt automatisch den Inhalt von site/ auf den IONOS-Webspace,
# sobald auf main gepusht wird (oder manuell über "Run workflow").
#
# site/ liegt nicht im Repository, sondern wird hier aus src/ erzeugt und
# anschließend hochgeladen. Damit können Quelle und Ergebnis nicht
# auseinanderlaufen, und es braucht lokal keine Node-Installation, um etwas
# zu veröffentlichen.
#
# Voraussetzung: drei Repository-Secrets unter
# Settings -> Secrets and variables -> Actions:
#   IONOS_FTP_SERVER    (Servername aus IONOS: Hosting -> SFTP & SSH)
#   IONOS_FTP_USERNAME  (z.B. u12345678, aus dem gleichen Bereich)
#   IONOS_FTP_PASSWORD  (das dazugehörige Passwort)
#
# Siehe DEPLOYMENT.md für die vollständige Schritt-für-Schritt-Anleitung.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # Dateien mit führendem Punkt werden von "src/**" nicht erfasst und
      # müssen einzeln genannt werden. Am 08.09.2026 blieben zwei Pushes,
      # die nur die .htaccess änderten, deshalb ohne jeden Lauf - die
      # Änderungen lagen im Repository, aber nie auf dem Webspace, und von
      # außen war das nicht zu sehen. Kommen weitere Punktdateien dazu,
      # gehören sie hier und beim Upload-Schritt unten hinein.
      - "src/root/.htaccess"
      - "build.js"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy via SFTP to IONOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Erzeugt site/ aus src/. Schlägt der Build fehl, bricht der Lauf hier
      # ab und es wird nichts hochgeladen - besser als eine halb
      # aktualisierte Seite im Netz.
      - name: Build site/ from src/
        run: node build.js

      - name: Upload site/ to IONOS webspace
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          server: ${{ secrets.IONOS_FTP_SERVER }}
          port: 22
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          local_path: "./site/*"
          remote_path: "/apps/"
          sftp_only: true

      # Derselbe Grund wie oben beim Auslöser: Der Stern im local_path
      # erfasst keine Dateien mit führendem Punkt. Am 08.09.2026 per SFTP
      # nachgesehen - nach dem Deploy war die .htaccess schlicht nicht da,
      # während alle übrigen Dateien ankamen.
      #
      # Warum nicht stattdessen den Ordner ohne Stern angeben: Dann legt die
      # Action das Verzeichnis "site" auf dem Webspace an, statt seinen
      # Inhalt nach /apps/ zu schreiben. Ein zweiter Schritt für eine Datei
      # ist der langweiligere, aber verlässlichere Weg.
      - name: Upload .htaccess (vom Stern oben nicht erfasst)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          server: ${{ secrets.IONOS_FTP_SERVER }}
          port: 22
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          local_path: "./site/.htaccess"
          remote_path: "/apps/"
          sftp_only: true
