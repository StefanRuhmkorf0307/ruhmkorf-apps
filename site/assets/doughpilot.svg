<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoughPilot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Schwestermotiv zu favicon.svg: derselbe Laib mit aufgestelltem Ohr,
       darueber der Kompassbogen mit Nadel. Der Laib traegt hier bewusst
       keinen Einschnitt - im Rechner-Zeichen ist die S-Kurve das Motiv,
       hier ist es die Navigation. So teilen sich beide Produkte eine
       Formsprache, bleiben aber unterscheidbar.

       Farblogik identisch zu favicon.svg: im Dark Mode tauschen Flaeche
       und Motiv, weil eine dunkelgruene Kachel auf dunkelgruenem Grund
       keinen Kontrast haette. -->
  <style>
    .plate { fill: #2d4635; }
    .mark  { stroke: #e8c37a; }
    .fill  { fill: #e8c37a; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d2a04a; }
      .mark  { stroke: #141c17; }
      .fill  { fill: #141c17; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14"/>
  <g transform="translate(32 34) scale(0.9) translate(-32 -34)">
    <path class="mark" d="M15 30 A18 18 0 0 1 49 30" fill="none" stroke-width="4.5" stroke-linecap="round"/>
    <path class="fill" d="M40 15 L26 26 L31 28 L33 33 Z"/>
    <path class="fill" d="M8 52 C8 44 12 39 20 37 L25 31 L29 37 C42 39 56 44 56 52 Z" opacity="0.24"/>
    <path class="mark" d="M8 52 C8 44 12 39 20 37 L25 31 L29 37 C42 39 56 44 56 52" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="mark" d="M8 52 H56" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
