<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoughPilot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Schwestermotiv zu favicon.svg: derselbe Laib, darueber der Kompass-
       bogen mit Nadel statt des Prozentzeichens. Bildidee aus dem
       Entwurfspaket unter sourdough-app/Infos/Design Ideas, neu gezeichnet
       fuer kleine Groessen.

       Farblogik identisch zum Schwestermotiv: im Dark Mode tauschen
       Flaeche und Zeichnung. -->
  <style>
    svg { --plate: #2d4635; --loaf: #e8c37a; --sym: #f4eddc; }
    @media (prefers-color-scheme: dark) {
      svg { --plate: #d2a04a; --loaf: #24382a; --sym: #14201a; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--plate)"/>
  <g transform="translate(32 34) scale(0.94) translate(-32 -34)">
    <path d="M14 26 A19 19 0 0 1 50 26" fill="none" stroke="var(--sym)" stroke-width="4" stroke-linecap="round"/>
    <path d="M28.5 21 L38 5 L34.5 26 Z" fill="var(--sym)"/>
    <path d="M11 44 C12 36 20 31 32 31 C45 31 52 36 53 44 C54 50 48 54 32 54 C17 54 11 51 11 45 Z" fill="none" stroke="var(--loaf)" stroke-width="4.6" stroke-linejoin="round"/>
    <path d="M18 42 C24 36 30 34 38 34" fill="none" stroke="var(--loaf)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M23 48 C29 42 35 40 43 40" fill="none" stroke="var(--loaf)" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
