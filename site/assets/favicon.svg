<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sauerteiglaib mit Gärkurve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Gemeinsames Zeichen für den Rechner und die spätere DoughPilot-App.
       Ein Sauerteiglaib mit aufgestelltem Ohr; der Einschnitt hat die Form
       einer S-Kurve (flach, steil, wieder flach) - genau der Verlauf, mit
       dem das Gärmodell den Gärstatus rechnet. Score und Gärkurve sind
       damit dieselbe Linie.

       Der Media-Query hellt das Zeichen im Dark Mode auf, passend zur
       Palette in style.css. Das wirkt auch, wenn die Datei als Favicon
       oder über <img> eingebunden ist. -->
  <style>
    .plate { fill: #a9601f; }
    .mark  { stroke: #f7ecdb; }
    .fill  { fill: #f7ecdb; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d9843c; }
      .mark  { stroke: #1c1712; }
      .fill  { fill: #1c1712; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14"/>
  <g transform="translate(32 34) scale(0.86) translate(-32 -34)">
    <path class="fill" d="M7 46 C7 34 13 26 26 24 L32 19 L36 25 C50 27 57 35 57 46 Z" opacity="0.22"/>
    <path class="mark" d="M7 46 C7 34 13 26 26 24 L32 19 L36 25 C50 27 57 35 57 46" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="mark" d="M7 46 H57" stroke-width="5" stroke-linecap="round"/>
    <path class="mark" d="M14 41 C21 41 23 39 27 35 C31 31 35 30 41 30 C45 30 47 30 49 30" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
