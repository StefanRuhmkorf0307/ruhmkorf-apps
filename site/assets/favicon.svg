<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoughCalculator" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Zeichen des DoughCalculators: Prozentzeichen ueber einem Sauerteiglaib
       mit zwei Einschnitten. Bildidee aus dem Entwurfspaket unter
       sourdough-app/Infos/Design Ideas, hier neu gezeichnet fuer kleine
       Groessen: kraeftigere Linien (rund 7 % der Bildbreite statt 2 %),
       dunkle Kachel fuer Kontrast, keine Filter.

       Schwestermotiv: doughpilot.svg - gleicher Laib, statt des Prozent-
       zeichens der Kompassbogen.

       Der Media-Query dreht Flaeche und Motiv im Dark Mode um: eine
       dunkelgruene Kachel haette auf dunkelgruenem Seitengrund keinen
       Kontrast mehr, also uebernimmt dort Gold die Flaeche. Wirkt auch im
       Browser-Tab und bei Einbindung ueber <img>. -->
  <style>
    svg { --plate: #2d4635; --loaf: #e8c37a; --sym: #f4eddc; }
    @media (prefers-color-scheme: dark) {
      svg { --plate: #d2a04a; --loaf: #24382a; --sym: #14201a; }
    }
  </style>
  <rect width="64" height="64" rx="14" fill="var(--plate)"/>
  <g transform="translate(32 34) scale(0.94) translate(-32 -34)">
    <circle cx="23" cy="12" r="4.8" fill="none" stroke="var(--sym)" stroke-width="3.6"/>
    <circle cx="41" cy="23" r="4.8" fill="none" stroke="var(--sym)" stroke-width="3.6"/>
    <line x1="43" y1="8" x2="21" y2="27" stroke="var(--sym)" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M11 44 C12 36 20 31 32 31 C45 31 52 36 53 44 C54 50 48 54 32 54 C17 54 11 51 11 45 Z" fill="none" stroke="var(--loaf)" stroke-width="4.6" stroke-linejoin="round"/>
    <path d="M18 42 C24 36 30 34 38 34" fill="none" stroke="var(--loaf)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M23 48 C29 42 35 40 43 40" fill="none" stroke="var(--loaf)" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
