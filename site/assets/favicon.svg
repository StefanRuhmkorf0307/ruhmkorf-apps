<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brot">
  <!-- Gemeinsames Favicon der Alltagshelfer-Seiten: rundes Brot mit drei
       Einschnitten, in der Primaerfarbe aus style.css (--color-primary).
       Bewusst grob gehalten, damit die Silhouette auch bei 16px traegt. -->
  <rect width="64" height="64" rx="14" fill="#a9601f"/>
  <ellipse cx="32" cy="35" rx="22" ry="16" fill="#f7ecdb"/>
  <g stroke="#a9601f" stroke-width="4" stroke-linecap="round">
    <line x1="19" y1="32" x2="28" y2="24"/>
    <line x1="27" y1="38" x2="36" y2="30"/>
    <line x1="35" y1="43" x2="44" y2="35"/>
  </g>
</svg>
