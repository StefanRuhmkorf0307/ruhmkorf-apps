<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sauerteiglaib mit Gärkurve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Zeichen des DoughCalculators. Ein Sauerteiglaib mit aufgestelltem Ohr
       auf etwa einem Drittel der Breite; der Einschnitt hat die Form einer
       S-Kurve (flach, steil, wieder flach) - genau der Verlauf, mit dem das
       Gaermodell den Gaerstatus rechnet. Score und Gaerkurve sind dieselbe
       Linie.

       Schwestermotiv: doughpilot.svg. Beide teilen denselben Laib, die App
       setzt zusaetzlich den Kompassbogen darueber.

       Der Media-Query dreht Flaeche und Motiv im Dark Mode um: Auf dunkel-
       gruenem Seitengrund haette eine dunkelgruene Kachel keinen Kontrast
       mehr, deshalb uebernimmt dort Gold die Flaeche. Das wirkt auch im
       Browser-Tab und bei Einbindung ueber <img>. -->
  <style>
    .plate { fill: #2d4635; }
    .mark  { stroke: #e8c37a; }
    .fill  { fill: #e8c37a; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d2a04a; }
      .mark  { stroke: #141c17; }
      .fill  { fill: #141c17; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14"/>
  <g transform="translate(32 34) scale(0.86) translate(-32 -34)">
    <path class="fill" d="M7 46 C7 37 10 30 19 27 L24 20 L28 27 C42 29 57 34 57 46 Z" opacity="0.24"/>
    <path class="mark" d="M7 46 C7 37 10 30 19 27 L24 20 L28 27 C42 29 57 34 57 46" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="mark" d="M7 46 H57" stroke-width="5" stroke-linecap="round"/>
    <path class="mark" d="M12 42 C16 42 18 40 21 36 C24 32 28 31 34 31 C41 31 46 31 50 31" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
